<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1311">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath d=%22M5 4h14l-6 8v6l3 2H8l3-2v-6z%22 fill=%22%23d9a548%22/%3E%3C/svg%3E">
<title>BarQuizz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Тренажер по меню бару: техкарти, схеми, картки, тести та збірка напоїв">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: app shell — sticky header, one working view, bottom tab bar; a recipe opens as a sheet.
   Every drink carries its own liquid colour (--dc) so tiles, cards and schemes read by colour first. */
:root{
  --bg:#0e1311; --surface:#151c19; --surface-2:#1e2724; --raise:#222c28; --line:#2a3530;
  --fg:#efe8d6; --muted:#939f98; --accent:#d9a548; --accent-ink:#1c1405;
  --good:#74c38f; --bad:#e58371; --glass:#d3dcd7; --glass-fill:rgba(211,220,215,.07);
  --shadow:0 20px 44px rgba(0,0,0,.45);
  --f-display:"Prata","Georgia","Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --c-spirit:#d08f3c; --c-liqueur:#b9588d; --c-bitter:#c9463c; --c-syrup:#e9a3bb;
  --c-cordial:#a98dde; --c-citrus:#e0cf52; --c-juice:#ec8c4b; --c-soda:#8fc6db;
  --c-dairy:#ece1c6; --c-foam:#f5f2ea; --c-tea:#a07a48; --c-premix:#d9a548; --c-other:#84918b;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef1ed; --surface:#fbfcfa; --surface-2:#e5ebe6; --raise:#ffffff; --line:#cdd7cf;
    --fg:#16201b; --muted:#56655d; --accent:#94640f; --accent-ink:#fff8ea;
    --good:#2b8550; --bad:#b4473b; --glass:#46564f; --glass-fill:rgba(70,86,79,.06);
    --shadow:0 20px 44px rgba(20,40,30,.14);
    --c-citrus:#d2bd2e; --c-foam:#fffefa; --c-dairy:#e7d7af; --c-soda:#7db8cf;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#eef1ed; --surface:#fbfcfa; --surface-2:#e5ebe6; --raise:#ffffff; --line:#cdd7cf;
  --fg:#16201b; --muted:#56655d; --accent:#94640f; --accent-ink:#fff8ea;
  --good:#2b8550; --bad:#b4473b; --glass:#46564f; --glass-fill:rgba(70,86,79,.06);
  --shadow:0 20px 44px rgba(20,40,30,.14);
  --c-citrus:#d2bd2e; --c-foam:#fffefa; --c-dairy:#e7d7af; --c-soda:#7db8cf;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e1311; --surface:#151c19; --surface-2:#1e2724; --raise:#222c28; --line:#2a3530;
  --fg:#efe8d6; --muted:#939f98; --accent:#d9a548; --accent-ink:#1c1405;
  --good:#74c38f; --bad:#e58371; --glass:#d3dcd7; --glass-fill:rgba(211,220,215,.07);
  --shadow:0 20px 44px rgba(0,0,0,.45);
  --c-citrus:#e0cf52; --c-foam:#f5f2ea; --c-dairy:#ece1c6; --c-soda:#8fc6db;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dc-glow{background:radial-gradient(120% 90% at 50% 18%,color-mix(in srgb,var(--dc) 34%,transparent) 0%,transparent 62%)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1;margin:0}
.brand span{color:var(--accent)}
.top-progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.top-progress b{color:var(--fg);font-family:var(--f-mono);font-weight:600}
.meter{width:96px;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

main{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.view{padding-block:22px 8px}
.view-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px;margin-bottom:18px}
.view-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,5.4vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.view-head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 6px}
.missing{color:var(--muted);font-weight:500;font-style:italic}

/* chips & segmented */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:background .15s,border-color .15s}
.chip small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:var(--accent-ink);opacity:.75}
.chip:hover:not(:disabled){border-color:var(--accent)}
.chip .sw{width:10px;height:10px}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg);box-shadow:0 1px 0 var(--line),0 4px 14px rgba(0,0,0,.18)}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px 7px 9px;font-weight:600;font-size:13.5px;text-align:left}
.pill i{width:12px;height:12px;border-radius:50%;background:var(--dc);box-shadow:0 0 0 3px color-mix(in srgb,var(--dc) 25%,transparent);flex:none}
.pill:hover{border-color:var(--dc)}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;background:var(--c);border:1px solid color-mix(in srgb,var(--fg) 18%,transparent);flex:none}

/* glass */
.glass{display:block;width:100%;height:auto;overflow:visible}

/* menu */
.toolbar{display:grid;gap:12px;margin-bottom:22px}
.search{position:relative}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px 13px 42px;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;color:var(--muted);font-size:13.5px}
.note b{color:var(--fg)}
.group{margin-bottom:30px}
.group-h{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.group-h h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.group-h small{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.group .note{margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px 14px;text-align:left;display:grid;grid-template-rows:auto 1fr;gap:6px;min-width:0;overflow:hidden;transition:transform .18s,border-color .18s,box-shadow .18s}
.tile:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--dc) 70%,var(--line));box-shadow:0 12px 28px color-mix(in srgb,var(--dc) 18%,transparent)}
.tile-art{height:128px;margin:-10px -12px 0;display:grid;place-items:center;padding-top:10px}
.tile-art svg{width:auto;height:112px}
.tile-name{font-family:var(--f-display);font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.tile-meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px;font-size:11.5px;color:var(--muted);font-weight:600}
.tile-meta span{display:inline-flex;align-items:center;gap:4px}
.tile-meta svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ring{position:absolute;top:10px;right:10px;width:24px;height:24px}
.ring circle{fill:none;stroke-width:3}
.empty{color:var(--muted);padding:30px 0;text-align:center}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(4,8,6,.62);animation:fade .2s}
.sheet-panel{position:relative;width:min(820px,100%);max-height:calc(100% - 20px - env(safe-area-inset-top,0px));overflow:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:var(--shadow);padding:0 0 calc(24px + env(safe-area-inset-bottom,0px));animation:rise .26s cubic-bezier(.2,.8,.2,1)}
@media (min-width:860px){.sheet{align-items:center}.sheet-panel{border-radius:24px;border-bottom:1px solid var(--line);max-height:90vh}}
@keyframes rise{from{transform:translateY(36px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.sheet-in{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media (min-width:860px){.sheet-in{padding-left:32px;padding-right:32px}}
.close{position:absolute;top:14px;right:14px;z-index:2;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 85%,transparent);display:grid;place-items:center;font-size:22px;line-height:1}
.hero{display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px;align-items:center;padding-block:26px 22px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,color-mix(in srgb,var(--dc) 20%,var(--bg)) 0%,var(--bg) 100%)}
.hero-art{display:grid;place-items:center}
.hero-art svg{width:200px}
.hero h2{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,7vw,46px);line-height:1.02;margin:0 0 14px;text-wrap:balance;padding-right:44px}
@media (max-width:640px){.hero{grid-template-columns:1fr;text-align:left;padding-top:18px}.hero-art svg{width:150px}}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.key{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--surface) 82%,transparent);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0}
.key-ic{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:var(--surface-2)}
.key-ic svg{width:34px;height:34px}
.key-ic svg.ico{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.key .lbl{margin:0 0 1px;font-size:10px}
.key p{margin:0;font-weight:700;font-size:13.5px;line-height:1.25;overflow-wrap:anywhere}
.key p small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.key.miss p{color:var(--muted);font-style:italic;font-weight:500}
.methods-ic{display:flex;gap:2px}
.methods-ic svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.block{margin-top:24px}
.ribbon{display:flex;gap:2px;height:44px;border-radius:12px;overflow:hidden;margin-bottom:6px}
.ribbon span{flex-basis:0;background:var(--c);display:grid;place-items:center;min-width:0;color:var(--ink);font-family:var(--f-mono);font-weight:700;font-size:13px;position:relative}
.ribbon span em{font-style:normal;font-size:9.5px;opacity:.75;position:absolute;bottom:3px;left:0;right:0;text-align:center;font-family:var(--f-body);font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.ribbon-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:12px}
.ribbon-cap b{font-family:var(--f-mono);color:var(--fg)}
.ing-list{list-style:none;margin:0;padding:0;display:grid}
.ing{display:grid;grid-template-columns:14px minmax(0,1fr) auto;column-gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.ing .sw{width:14px;height:14px;border-radius:5px}
.ing-name{font-weight:650;min-width:0;overflow-wrap:anywhere}
.ing-name small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.04em}
.ing-amt{font-family:var(--f-mono);font-weight:700;font-size:16px;text-align:right;white-space:nowrap}
.ing-amt u{text-decoration:none;color:var(--muted);font-size:11px;margin-left:3px;font-weight:500}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px}
.link{background:none;border:0;padding:0;color:inherit;font-weight:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;text-align:left}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.split{grid-template-columns:1fr}}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.box h4{margin:0 0 8px;font-size:14px}
.box ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.box li{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.box li b{font-family:var(--f-mono)}
.box.bat{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:12px;font-weight:700;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--accent)}
.used{display:flex;flex-wrap:wrap;gap:8px}
.sim{display:grid;gap:10px}
.sim-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;text-align:left}
.sim-row:hover{border-color:var(--dc)}
.sim-row svg{height:56px;width:auto}
.sim-row h5{margin:0 0 6px;font-family:var(--f-display);font-weight:400;font-size:18px}
.diff{display:flex;flex-wrap:wrap;gap:5px}
.diff span{font-size:11.5px;font-weight:650;border-radius:6px;padding:2px 7px;background:var(--surface-2)}
.diff .same{color:var(--muted)}
.diff .here{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--fg)}
.diff .there{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px}
.d-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent}

/* schemes */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.board-col{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.board-top{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;margin-bottom:12px}
.board-top svg{height:72px;width:auto}
.board-top svg.ico{height:40px;stroke:var(--accent);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.board-top h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.1}
.board-top p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.board-list{display:flex;flex-wrap:wrap;gap:6px}
.irow{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(70px,1.2fr) 54px;gap:10px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px;text-align:left}
.irow + .irow{margin-top:6px}
.irow:hover{border-color:var(--dc)}
.irow svg{height:38px;width:auto}
.irow-name{font-weight:700;min-width:0;overflow-wrap:anywhere;line-height:1.2}
.irow-name small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.irow-bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.irow-bar i{display:block;height:100%;border-radius:99px;background:var(--c)}
.irow b{font-family:var(--f-mono);text-align:right;font-size:14px}
.mx-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.mx{border-collapse:separate;border-spacing:0;min-width:100%;font-size:13px}
.mx th,.mx td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.mx thead th{vertical-align:bottom;background:var(--surface);position:sticky;top:0}
.mx tbody th{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;font-weight:650;display:flex;gap:8px;align-items:center;border-right:1px solid var(--line);min-width:150px;max-width:210px;white-space:normal;line-height:1.2}
.mx thead th:first-child{position:sticky;left:0;z-index:2}
.mx-h{display:grid;justify-items:center;gap:4px;background:none;border:0;padding:0;font-weight:700;font-size:12.5px;width:84px;white-space:normal;line-height:1.15}
.mx-h svg{height:52px;width:auto}
.mx td{text-align:center;font-family:var(--f-mono);font-weight:700}
.mx td.has{background:color-mix(in srgb,var(--c) 22%,transparent)}
.mx td.no{color:var(--line)}
.mx tr.all th{color:var(--accent)}
.mx tr.meta td{font-family:var(--f-body);font-weight:600;font-size:12px;white-space:normal;min-width:84px;color:var(--muted)}
.mx tr:last-child th,.mx tr:last-child td{border-bottom:0}

/* flashcards */
.deck-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.counts{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.counts b{font-family:var(--f-mono);color:var(--fg);margin-right:4px}
.stage{perspective:1400px;max-width:580px;margin:0 auto}
.card{position:relative;height:min(66vh,560px);min-height:420px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.front{display:grid;grid-template-rows:1fr auto;text-align:center;padding:26px;background:radial-gradient(110% 70% at 50% 0%,color-mix(in srgb,var(--dc) 30%,var(--surface)) 0%,var(--surface) 65%)}
.front-main{display:grid;place-items:center;align-content:center;gap:10px}
.front h3{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,8.4vw,52px);line-height:1.02;margin:0;text-wrap:balance}
.front p{color:var(--muted);margin:0;font-size:14px}
.front .silhouette svg{height:150px;width:auto}
.front-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.back{transform:rotateY(180deg);overflow:auto}
.back-hero{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center;padding:18px 18px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--dc) 24%,var(--surface)) 0%,var(--surface) 100%)}
.back-hero svg{width:110px}
.back-hero h3{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.05;margin:0 0 8px}
.back-body{padding:4px 18px 20px}
.back .ing{padding:6px 0}
.back .ing-amt{font-size:14px}
.mini-keys{display:flex;flex-wrap:wrap;gap:6px}
.mini-keys span{font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:580px;margin:16px auto 0}
.rate .btn{display:grid;gap:2px;padding:12px 8px;text-align:center}
.rate .btn small{font-weight:500;color:var(--muted);font-size:11.5px}
.rate .bad{border-color:color-mix(in srgb,var(--bad) 60%,var(--line))}
.rate .ok{border-color:color-mix(in srgb,var(--good) 60%,var(--line))}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;margin-top:10px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.qz-setup{display:grid;gap:18px;max-width:660px}
.qz-progress{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.qz-progress .meter{flex:1;width:auto}
.qz-main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.qz-main.has-art{grid-template-columns:120px minmax(0,1fr);align-items:center}
.qz-art{border-radius:16px;padding:8px 4px;display:grid;place-items:center}
.qz-art svg{width:108px}
.qz-art.dc-glow{background:radial-gradient(closest-side,color-mix(in srgb,var(--dc) 34%,transparent),transparent)}
.qz-main.big-art{grid-template-columns:1fr;justify-items:center}

.qz-main.big-art .qz-art svg{width:170px}

.qz-q{font-size:clamp(19px,4.2vw,24px);line-height:1.35;margin:0;text-wrap:balance}
.qz-q b{font-family:var(--f-display);font-weight:400;color:var(--accent)}
.qz-sub{margin-top:12px}
.qz-sub .chip{cursor:default}
.opts{display:grid;gap:10px;margin-top:18px}
@media (min-width:640px){.opts{grid-template-columns:1fr 1fr}}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;font-weight:650;display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:22px;height:22px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--bg))}
.opt:disabled{cursor:default}

.verdict{font-weight:800}
.verdict.good{color:var(--good)}
.verdict.bad{color:var(--bad)}
.score{font-family:var(--f-display);font-size:68px;line-height:1;margin:6px 0}
.mist{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.mist li{border-top:1px solid var(--line);padding-top:8px;font-size:14px}
.mist li span{color:var(--good);font-weight:700}

function parseIng(s){

  const name = m ? m[1].trim() : s.trim();
  const amt = m ? m[2].trim() : '';
  const num = /^\d+([.,]\d+)?$/.test(amt) ? parseFloat(amt.replace(',','.')) : null;
  let link = null;
  for (const [re,id] of PREP_LINK) if (re.test(name)) { link = id; break; }
  return {name, amt, num, inPremix, fam:famOf(name), link};
}

  return `<svg viewBox="0 0 60 50" aria-hidden="true"><path d="M6 26 L54 26" stroke="var(--glass)" stroke-width="2" stroke-linecap="round" opacity=".5"/>${garnishSVG(fake, {rx:46, t:26, cx:26, sy:26, hw:16})}</svg>`;
}
function methodIcons(m){
  return `<span class="methods-ic">${tokens(m).map(t => METHODS[t] ? `<svg viewBox="0 0 24 24" aria-hidden="true">${METHODS[t].i}</svg>` : '').join('')}</span>`;
}
const tokens = m => (m || '').split(',').map(t => t.trim().toLowerCase().replace('драйшейк','драй шейк')).filter(Boolean);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

/* ---------- shared bits ---------- */
function ring(id){
  const b = box(id) + 1, C = 2*Math.PI*9;
  return `<svg class="ring" viewBox="0 0 24 24" aria-label="Рівень ${b} з 5"><circle cx="12" cy="12" r="9" stroke="var(--surface-2)"/><circle cx="12" cy="12" r="9" stroke="var(--accent)" stroke-dasharray="${(C*b/5).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 12 12)" stroke-linecap="round"/></svg>`;
}
function tileMeta(it){
  if (it.cat === 'premix') return `<span>${ico('portion').replace('class="ico"','')} порція ${esc(it.portion)}</span>`;
  if (it.cat === 'prep') return `<span>вихід ${esc(it.yield)}</span>`;
  if (it.cat === 'tea') return `<span>${it.ing.length} інгредієнтів</span>`;
  const parts = [];
  if (it.glass) parts.push(`<span>${esc(it.glass)}</span>`);
  if (it.method) parts.push(`<span>${methodIcons(it.method).replace('methods-ic','')}${esc(it.method)}</span>`);
  if (it.price) parts.push(`<span>₴ ${esc(it.price)}</span>`);
  return parts.join('') || '<span>посуд і спосіб не вказані</span>';
}
function ingRows(it, compact){
  return it.ing.map(g => {
    const L = isLiquid(it,g);
    const nm = g.link && BY[g.link] && g.link !== it.id ? `<button class="link" data-open="${g.link}">${esc(g.name)}</button>` : esc(g.name);
    const amt = L ? `${fmt(g.num)}<u>мл</u>` : esc(g.amt || '—');
    return `<li class="ing"><span class="sw" style="--c:var(--c-${g.fam})"></span>
      <span class="ing-name">${nm}${g.inPremix?'<span class="tag" title="Входить у премікс">бат</span>':''}${compact?'':`<small>${FAM_LBL[g.fam]}</small>`}</span>
      <span class="ing-amt">${amt}</span></li>`;
  }).join('');
}
function ribbon(it){
  const liq = it.ing.filter(g => isLiquid(it,g));
  if (liq.length < 2) return '';
  const total = liq.reduce((s,g)=>s+g.num,0);
  return `<div class="ribbon" role="img" aria-label="Пропорції рідин">${liq.map(g => {
    const p = g.num/total;
    return `<span style="flex-grow:${g.num};--c:var(--c-${g.fam});--ink:${FAM_INK[g.fam]}" title="${esc(g.name)} — ${fmt(g.num)} мл">${p>=.07?fmt(g.num):''}${p>=.16?`<em>${esc(g.name)}</em>`:''}</span>`;
  }).join('')}</div><div class="ribbon-cap"><span>Пропорції рідин, мл</span><span>разом <b>${fmt(total)}</b></span></div>`;
}
function keyHTML(icon, label, value, miss, note){
  return `<div class="key${miss?' miss':''}"><div class="key-ic">${icon || ''}</div><div style="min-width:0"><p class="lbl">${label}</p><p>${esc(value)}${note?`<small>${esc(note)}</small>`:''}</p></div></div>`;
}
function keysHTML(it){
  const K = [];
  if (isDrink(it)) {
    const gk = glassKeyOf(it.glass);
    K.push(keyHTML(gk ? svgGlass(it,{size:'icon', empty:true, garnish:false}) : '', 'Посуд', it.glass || 'не вказано', !it.glass));
    K.push(keyHTML(it.method ? methodIcons(it.method) : '', 'Спосіб', it.method || 'не вказано', !it.method, it.methodNote || (it.method ? tokens(it.method).map(t=>METHODS[t]?.d).filter(Boolean).join('; ') : '')));
    K.push(keyHTML(garnishIcon(it), 'Гарніш', it.garnish || 'не вказано', !it.garnish));
    if (hasFoam(it)) K.push(keyHTML(ico('foam'), 'Піна', 'Ізіфоам'));
    if (it.top) K.push(keyHTML(ico('top'), 'Топ', it.top));
    if (it.premix) K.push(keyHTML(ico('bat'), 'Бат', `${BY[it.premix].name} · ${BY[it.premix].portion}`));
    if (it.price) K.push(keyHTML(ico('price'), 'Ціна', it.price, false, `собівартість ${it.cost}`));
  } else if (it.cat === 'premix') {
    K.push(keyHTML(ico('portion'), 'Порція', it.portion));
    K.push(keyHTML(ico('bat'), 'Для напою', (it.for||[]).map(x=>BY[x]?.name).filter(Boolean).join(', ') || 'техкарти немає', !(it.for||[]).length));
  } else if (it.cat === 'prep') {
    K.push(keyHTML(ico('yield'), 'Вихід', it.yield));
    K.push(keyHTML(ico('bat'), 'Інгредієнтів', String(it.ing.length)));
  } else if (it.cat === 'tea') {
    K.push(keyHTML(garnishIcon(it), 'У чайнику', `${it.ing.length} інгредієнтів`));
  }
  return `<div class="keys">${K.join('')}</div>`;
}
function similar(it){
  const A = new Set(it.ing.map(g => norm(g.name)));
  return ITEMS.filter(o => o.id !== it.id && o.cat === it.cat).map(o => {
    const Bn = new Set(o.ing.map(g => norm(g.name)));
    const inter = [...A].filter(x => Bn.has(x)).length;
    return {o, inter, s: inter / (A.size + Bn.size - inter)};
  }).filter(x => x.inter >= 2).sort((a,b) => b.s - a.s).slice(0,3);
}

/* ---------- detail sheet ---------- */
const sheet = document.getElementById('sheet'), panel = document.getElementById('sheet-panel');
let lastFocus = null;
function openDetail(id){
  const it = BY[id]; if (!it) return;
  if (sheet.hidden) lastFocus = document.activeElement;
  const dc = dcOf(it);
  let html = `<button class="close" data-act="close" aria-label="Закрити">×</button>
    <div class="hero sheet-in" style="--dc:${dc}"><div class="hero-art">${svgGlass(it,{size:'big'})}</div>
    <div style="min-width:0"><p class="eyebrow">${CATS[it.cat]}</p><h2 id="sheet-title">${esc(it.name)}</h2>${keysHTML(it)}</div></div>
    <div class="sheet-in">`;
  html += `<div class="block"><p class="lbl">${it.cat==='prep'?'Склад заготовки':'Формула'}</p>${ribbon(it)}<ul class="ing-list">${ingRows(it)}</ul></div>`;
  if (it.premix && BY[it.premix]) {
    const pm = BY[it.premix], svc = it.ing.filter(g => !g.inPremix);
    html += `<div class="block"><p class="lbl">Бат + сервіс</p><div class="split">
      <div class="box bat"><h4>З бату · <button class="link" data-open="${pm.id}">${esc(pm.name)}</button> <span class="missing" style="font-style:normal">(${esc(pm.portion)})</span></h4><ul>${pm.ing.map(g=>`<li><span>${esc(g.name)}</span><b>${esc(g.amt)}</b></li>`).join('')}</ul></div>
      <div class="box"><h4>Додаєш на сервісі</h4><ul>${svc.length ? svc.map(g=>`<li><span>${esc(g.name)}</span><b>${esc(g.amt)}</b></li>`).join('') : '<li>Нічого — тільки бат</li>'}</ul></div></div></div>`;
  }
  if (it.prep && BY[it.prep]) html += `<div class="block"><p class="lbl">Премікс</p><div class="box"><p style="margin:0">Премікс — це заготовка <button class="link" data-open="${it.prep}">${esc(BY[it.prep].name)}</button></p></div></div>`;
  if (it.cat === 'premix') {
    const used = (it.for||[]).filter(x=>BY[x]);
    html += `<div class="block"><p class="lbl">Для напою</p>${used.length ? `<div class="used">${used.map(x=>`<button class="pill" style="--dc:${dcOf(BY[x])}" data-open="${x}"><i></i>${esc(BY[x].name)}</button>`).join('')}</div>` : `<p class="missing">Повної техкарти напою поки немає</p>`}</div>`;
  }
  if (it.steps) html += `<div class="block"><p class="lbl">Приготування</p><ol class="steps">${it.steps.map(s=>`<li><span>${esc(s)}</span></li>`).join('')}</ol></div>`;
  if (USED[it.id]) html += `<div class="block"><p class="lbl">Де використовується</p><div class="used">${[...USED[it.id]].map(x=>`<button class="pill" style="--dc:${dcOf(BY[x])}" data-open="${x}"><i></i>${esc(BY[x].name)}</button>`).join('')}</div></div>`;
  const sim = it.cat !== 'prep' ? similar(it) : [];
  if (sim.length) {
    const mine = new Map(it.ing.map(g => [norm(g.name), g.name]));
    html += `<div class="block"><p class="lbl">Не переплутай зі схожими</p>
      <div class="legend"><span><i style="background:color-mix(in srgb,var(--good) 40%,transparent)"></i>тільки в ${esc(it.name)}</span><span><i style="background:color-mix(in srgb,var(--bad) 40%,transparent)"></i>тільки в схожому</span><span><i style="background:var(--surface-2)"></i>спільне</span></div>
      <div class="sim">${sim.map(({o}) => {
        const theirs = new Map(o.ing.map(g => [norm(g.name), g.name]));
        const same = [...mine.keys()].filter(k => theirs.has(k)).map(k => mine.get(k));
        const here = [...mine.keys()].filter(k => !theirs.has(k)).map(k => mine.get(k));
        const there = [...theirs.keys()].filter(k => !mine.has(k)).map(k => theirs.get(k));
        const extra = [];
        if (isDrink(it) && it.glass !== o.glass && o.glass) extra.push(`<span class="there">посуд: ${esc(o.glass)}</span>`);
        if (isDrink(it) && it.method !== o.method && o.method) extra.push(`<span class="there">${esc(o.method)}</span>`);
        return `<button class="sim-row" style="--dc:${dcOf(o)}" data-open="${o.id}">${svgGlass(o,{size:'mini'})}<div style="min-width:0"><h5>${esc(o.name)}</h5><div class="diff">${here.map(n=>`<span class="here">${esc(n)}</span>`).join('')}${there.map(n=>`<span class="there">${esc(n)}</span>`).join('')}${extra.join('')}${same.map(n=>`<span class="same">${esc(n)}</span>`).join('')}</div></div></button>`;
      }).join('')}</div></div>`;
  }
  if (it.note) html += `<div class="block note">${esc(it.note)}</div>`;
  if (it.cat === 'tea') html += `<div class="block note">${RAW.notes.tea}</div>`;
  if (it.cat === 'prep') html += `<div class="block note">${RAW.notes.prep}</div>`;
  html += `<div class="d-actions">${['cocktail','lemonade','premix'].includes(it.cat)?`<button class="btn primary" data-build="${it.id}">Зібрати по пам’яті</button>`:''}<button class="btn" data-card="${it.id}">Вчити картку</button></div></div>`;
  panel.innerHTML = html;
  sheet.hidden = false; document.body.classList.add('locked');
  panel.scrollTop = 0;
  panel.querySelector('.close').focus();
}
function closeDetail(){ sheet.hidden = true; document.body.classList.remove('locked'); if (lastFocus) { try{lastFocus.focus()}catch(e){} lastFocus = null; } }

/* ---------- MENU ---------- */
const M = {cat:'all', q:''};
function tileHTML(it){
  return `<button class="tile" data-open="${it.id}" style="--dc:${dcOf(it)}"><div class="tile-art dc-glow">${svgGlass(it,{size:'tile'})}</div>
    <div style="min-width:0"><div class="tile-name">${esc(it.name)}</div><div class="tile-meta">${tileMeta(it)}</div></div>${ring(it.id)}</button>`;
}
function renderMenu(){
  const el = document.getElementById('v-menu');
  if (!el.dataset.ready) {
    el.innerHTML = `<div class="view-head"><div><h2>Меню бару</h2><p>Колір рідини, посуд і гарніш — як у реальному напої. Відкрий позицію: формула, бат, схожі напої й заготовки.</p></div></div>
      <div class="toolbar"><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="m-search" type="search" placeholder="Пошук: назва, інгредієнт або гарніш" autocomplete="off"></label>
      <div class="seg" id="m-cats" role="group" aria-label="Категорія"></div></div><div id="m-list"></div>`;
    el.dataset.ready = 1;
    el.querySelector('#m-search').addEventListener('input', e => { M.q = e.target.value.trim().toLowerCase(); drawMenuList(); });
  }
  const counts = c => ITEMS.filter(i => c==='all' || i.cat===c).length;
  el.querySelector('#m-cats').innerHTML = ['all',...CAT_ORDER].map(c => `<button data-mcat="${c}" aria-pressed="${M.cat===c}">${c==='all'?'Усе':CATS[c]} <small style="font-family:var(--f-mono);opacity:.6">${counts(c)}</small></button>`).join('');
  drawMenuList();
}
function drawMenuList(){
  const list = document.getElementById('m-list');
  const match = it => !M.q || it.name.toLowerCase().includes(M.q) || it.ing.some(g => g.name.toLowerCase().includes(M.q)) || (it.garnish||'').toLowerCase().includes(M.q);
  let html = '';
  for (const c of CAT_ORDER) {
    if (M.cat !== 'all' && M.cat !== c) continue;
    const items = ITEMS.filter(i => i.cat === c && match(i));
    if (!items.length) continue;
    html += `<div class="group"><div class="group-h"><h3>${CATS[c]}</h3><small>${items.length}</small></div>`;
    if (c === 'tea' && M.cat === 'tea') html += `<div class="note">${RAW.notes.tea}</div>`;
    if (c === 'prep' && M.cat === 'prep') html += `<div class="note">${RAW.notes.prep}</div>`;
    html += `<div class="grid">${items.map(tileHTML).join('')}</div></div>`;
  }
  list.innerHTML = html || `<p class="empty">Нічого не знайдено за «${esc(M.q)}».</p>`;
}

const FAMILIES = () => {

  return [
    {id:'negroni', name:'Негроні-родина', ids:['negroni','boulevardier','mc','blood-vial']},
    {id:'foam', name:'З піною', ids:drinks.filter(hasFoam).map(d=>d.id)},
    {id:'sparkling', name:'З ігристим', ids:drinks.filter(d=>d.ing.some(g=>/garda|брют/i.test(g.name))).map(d=>d.id)},
    {id:'tonic', name:'Тонік і содова', ids:drinks.filter(d=>d.cat==='cocktail'&&d.ing.some(g=>/тонік|содов/i.test(g.name))).map(d=>d.id)},
    {id:'lemonade', name:'Лимонади', ids:ITEMS.filter(i=>i.cat==='lemonade').map(i=>i.id)},
    {id:'tea', name:'Чаї', ids:ITEMS.filter(i=>i.cat==='tea').map(i=>i.id)},

    {id:'infused', name:'Інфузії', ids:['raspberry-gin','strawberry-rum','fresh-ginger']},
  ];
};
function renderSchemes(){
  const el = document.getElementById('v-schemes');
  const modes = [['glass','Посуд'],['method','Спосіб'],['ing','Інгредієнт → де'],['compare','Порівняння']];
  let body = '';
  const drinks = ITEMS.filter(isDrink);
  if (SC.mode === 'glass') {
    const groups = {};
    drinks.forEach(d => { const k = glassKeyOf(d.glass) || 'none'; (groups[k] ||= []).push(d); });
    body = `<div class="board">${['rocks','highball','coupe','nick','wine','flute','none'].filter(k=>groups[k]).map(k => `<div class="board-col">
      <div class="board-top">${k==='none' ? svgGlass({cat:'cocktail', ing:[]},{size:'icon',empty:true,garnish:false}) : svgGlass({cat:'cocktail', glass:GLASS_NAMES[k], ing:[]},{size:'icon',empty:true,garnish:false,glass:k})}
      <div><h4>${k==='none'?'Посуд не вказано':GLASS_NAMES[k]}</h4><p>${groups[k].length} ${plural(groups[k].length)}</p></div></div>
      <div class="board-list">${groups[k].map(d=>`<button class="pill" style="--dc:${dcOf(d)}" data-open="${d.id}"><i></i>${esc(d.name)}</button>`).join('')}</div></div>`).join('')}</div>`;
  } else if (SC.mode === 'method') {
    const groups = {};
    drinks.forEach(d => { const t = tokens(d.method); (t.length ? t : ['none']).forEach(x => (groups[x] ||= []).push(d)); });
    body = `<div class="board">${['білд','стір','шейк','драй шейк','ролл','none'].filter(k=>groups[k]).map(k => `<div class="board-col">
      <div class="board-top">${k==='none'?'<span></span>':`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${METHODS[k].i}</svg>`}<div><h4>${k==='none'?'Спосіб не вказано':cap(k)}</h4><p>${k==='none'?'':METHODS[k].d+' · '}${groups[k].length} ${plural(groups[k].length)}</p></div></div>
      <div class="board-list">${groups[k].map(d=>`<button class="pill" style="--dc:${dcOf(d)}" data-open="${d.id}"><i></i>${esc(d.name)}</button>`).join('')}</div></div>`).join('')}</div>`;
  } else if (SC.mode === 'ing') {
    const usage = {};
    ITEMS.filter(i => isDrink(i) || i.cat === 'tea').forEach(it => it.ing.forEach(g => { const k = norm(g.name); (usage[k] ||= {k, name:g.name, fam:g.fam, rows:[]}).rows.push({it,g}); }));
    const list = Object.values(usage).filter(u => u.rows.length >= 2).sort((a,b) => b.rows.length - a.rows.length || a.name.localeCompare(b.name));
    if (!SC.ing || !usage[SC.ing]) SC.ing = list[0].k;
    const sel = usage[SC.ing];
    const max = Math.max(...sel.rows.map(r => r.g.num || 0), 1);
    body = `<div class="chips" style="margin-bottom:16px">${list.map(u => `<button class="chip" data-sing="${u.k}" aria-pressed="${u.k===SC.ing}"><span class="sw" style="--c:var(--c-${u.fam})"></span>${esc(u.name)}<small>${u.rows.length}</small></button>`).join('')}</div>
      <div class="panel"><div class="group-h"><h3>${esc(sel.name)}</h3><small>${sel.rows.length} ${plural(sel.rows.length)}</small></div>
      ${sel.rows.sort((a,b)=>(b.g.num||0)-(a.g.num||0)).map(({it,g}) => `<button class="irow" style="--dc:${dcOf(it)};--c:var(--c-${g.fam})" data-open="${it.id}">${svgGlass(it,{size:'mini'})}
        <span class="irow-name">${esc(it.name)}<small>${CATS[it.cat]}${it.glass?' · '+esc(it.glass):''}</small></span>
        <span class="irow-bar"><i style="width:${g.num?(g.num/max*100).toFixed(0):6}%"></i></span><b>${esc(g.amt)}</b></button>`).join('')}</div>`;
  } else {
    const fams = FAMILIES();
    const F = fams.find(f => f.id === SC.fam) || fams[0];
    const its = F.ids.map(id => BY[id]).filter(Boolean);
    const rows = [];
    its.forEach(it => it.ing.forEach(g => { const k = norm(g.name); let r = rows.find(x => x.k === k); if (!r) rows.push(r = {k, name:g.name, fam:g.fam, cells:{}}); r.cells[it.id] = g; }));
    rows.sort((a,b) => Object.keys(b.cells).length - Object.keys(a.cells).length);
    const n = its.length;
    const meta = its.some(isDrink) ? [['Посуд','glass'],['Спосіб','method'],['Гарніш','garnish']] : its.some(i=>i.cat==='prep') ? [['Вихід','yield']] : [];
    body = `<div class="chips" style="margin-bottom:16px">${fams.map(f => `<button class="chip" data-sfam="${f.id}" aria-pressed="${f.id===F.id}">${esc(f.name)}<small>${f.ids.length}</small></button>`).join('')}</div>
      <p class="lbl">Рядки зверху — спільне для всіх, нижче — те, чим вони відрізняються</p>
      <div class="mx-wrap"><table class="mx"><thead><tr><th></th>${its.map(it => `<th><button class="mx-h" data-open="${it.id}" style="--dc:${dcOf(it)}">${svgGlass(it,{size:'mini'})}${esc(it.name)}</button></th>`).join('')}</tr></thead><tbody>
      ${rows.map(r => `<tr class="${Object.keys(r.cells).length===n && n>1?'all':''}"><th><span class="sw" style="--c:var(--c-${r.fam})"></span>${esc(r.name)}</th>${its.map(it => { const g = r.cells[it.id]; return g ? `<td class="has" style="--c:var(--c-${g.fam})">${esc(g.amt||'✓')}</td>` : '<td class="no">·</td>'; }).join('')}</tr>`).join('')}
      ${meta.map(([l,f]) => `<tr class="meta"><th>${l}</th>${its.map(it => `<td>${esc(it[f]||'—')}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>`;
  }
  el.innerHTML = `<div class="view-head"><div><h2>Схеми</h2><p>Меню, розкладене по полицях: що в якому посуді, яким способом, де стоїть кожен інгредієнт і чим відрізняються схожі напої.</p></div></div>

function buildQuiz(){

  for (const it of ITEMS) {
    if (!Z.cats.has(it.cat)) continue;

    const img = {img:it.id};
    if (isDrink(it)) {

      if (it.garnish) Q.push(mkQ(it.id, `Гарніш для ${bq(it.name)}?`, it.garnish, pools.garnish));
      if (it.glass || it.garnish) Q.push(mkQ(it.id, 'Що це за напій?', it.name, same.map(o=>o.name), {img:it.id, big:true}));
    }
    if (it.cat === 'tea') Q.push(mkQ(it.id, 'Що це за чай?', it.name, same.map(o=>o.name), {img:it.id, big:true}));
    if (it.cat !== 'prep') {

      }
      if (it.ing.length >= 2 && it.cat !== 'premix') Q.push(mkQ(it.id, 'Що за напій за складом?', it.name, same.map(o=>o.name), {sub: it.ing.map(g=>g.name)}));
      const own = it.ing.map(g => norm(g.name));
      const foreign = uniq(same.flatMap(o => o.ing.map(g => g.name))).filter(n => !own.includes(norm(n)));
      if (it.ing.length >= 3 && foreign.length) { const ans = pick(foreign); Q.push({itemId:it.id, q:`Що з цього НЕ входить у ${bq(it.name)}?`, answer:ans, options: shuffle([ans, ...sample(it.ing.map(g=>g.name),3)]), img:it.id}); }
    }
    if (it.premix) {

    if (it.cat === 'premix') Q.push(mkQ(it.id, `Порція преміксу ${bq(it.name)}?`, it.portion, ITEMS.filter(o=>o.cat==='premix').map(o=>o.portion)));
    if (it.cat === 'prep') {
      Q.push(mkQ(it.id, `Вихід заготовки ${bq(it.name)}?`, it.yield, same.map(o=>o.yield)));
      Q.push(mkQ(it.id, 'Що за заготовка?', it.name, same.map(o=>o.name), {sub: it.ing.map(g=>g.name)}));

        ${extra}
        ${B.checked?`<p class="bd-result">Результат: ${pct}%</p><div class="d-actions" style="margin-top:8px"><button class="btn primary" data-act="bnew">Наступний</button><button class="btn" data-open="${it.id}">Техкарта</button></div>`
          :`<div class="d-actions" style="margin-top:16px"><button class="btn primary" data-act="bcheck" ${picked.length?'':'disabled'}>Перевірити</button></div>`}
      </div></div>`;
  if (B.checked && !B.scored) {
    B.scored = true;
    if (pct >= 90) setBox(it.id, box(it.id) < 0 ? 2 : box(it.id) + 1); else if (pct < 50) setBox(it.id, 0);
    save();
  }
}
const refreshLive = () => { const l = document.getElementById('b-live'); if (l) l.innerHTML = liveGlass(); };

/* ---------- routing & events ---------- */
const VIEWS = {menu:renderMenu, schemes:renderSchemes, cards:renderCards, quiz:renderQuiz, build:renderBuild};
let view = 'menu';
function go(v){
  if (!VIEWS[v]) v = 'menu';
  view = v;
  for (const k in VIEWS) document.getElementById('v-'+k).hidden = k !== v;
  document.querySelectorAll('[data-nav]').forEach(b => b.setAttribute('aria-current', b.dataset.nav === v ? 'page' : 'false'));
  VIEWS[v]();
  try { history.replaceState(null, '', '#' + v); } catch(e){}
  window.scrollTo(0,0);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-act],#card'); if (!t) return;
  const d = t.dataset;
  if (d.nav) return go(d.nav);
  if (d.act === 'close') return closeDetail();
  if (d.open) return openDetail(d.open);
  if (d.build) { closeDetail(); B.cats.add(BY[d.build].cat); newBuild(d.build); return go('build'); }
  if (d.card) { closeDetail(); C.cats.add(BY[d.card].cat); C.cur = d.card; C.flipped = false; C.hint = false; return go('cards'); }
  if (d.mcat) { M.cat = d.mcat; return renderMenu(); }
  if (d.smode) { SC.mode = d.smode; return renderSchemes(); }
  if (d.sing) { SC.ing = d.sing; return renderSchemes(); }
  if (d.sfam) { SC.fam = d.sfam; return renderSchemes(); }
  if (d.act === 'hint') { C.hint = true; return renderCards(); }
  if (t.id === 'card') { C.flipped = !C.flipped; t.classList.toggle('flipped', C.flipped); return; }
  if (d.ccat) { C.cats.has(d.ccat) ? C.cats.delete(d.ccat) : C.cats.add(d.ccat); C.cur = null; return renderCards(); }
  if (d.rate) return rateCard(+d.rate);
  if (d.zcat) { Z.cats.has(d.zcat) ? Z.cats.delete(d.zcat) : Z.cats.add(d.zcat); return renderQuiz(); }
  if (d.zn) { Z.n = +d.zn; return renderQuiz(); }
  if (d.act === 'zstart' || d.act === 'zagain') return startQuiz();
  if (d.act === 'zsetup') { Z.list = null; return renderQuiz(); }
  if (d.opt) return answer(+d.opt);
  if (d.act === 'znext') {
    if (Z.i + 1 >= Z.list.length) { const pct = Math.round(Z.score / Z.list.length * 100); if (pct > (S.best||0)) { S.best = pct; save(); } }
    Z.i++; Z.picked = null; return renderQuiz();
  }
  if (d.bcat) { B.cats.has(d.bcat) ? B.cats.delete(d.bcat) : B.cats.add(d.bcat); B.item = null; return renderBuild(); }
  if (d.pool !== undefined) { const n = d.pool; if (n in B.picked) delete B.picked[n]; else B.picked[n] = ''; return renderBuild(); }
  if (d.act === 'bcheck') { B.checked = true; B.scored = false; return renderBuild(); }
  if (d.act === 'bnew') { newBuild(); return renderBuild(); }
});
document.addEventListener('input', e => { const n = e.target.dataset?.amt; if (n !== undefined) { B.picked[n] = e.target.value; refreshLive(); } });
document.addEventListener('change', e => {
  const s = e.target.dataset?.bsel; if (!s) return;
  if (s === 'pick') { newBuild(e.target.value); return renderBuild(); }
  B[s] = e.target.value; refreshLive();
});
document.addEventListener('keydown', e => {
  if (!sheet.hidden) { if (e.key === 'Escape') closeDetail(); return; }
  if (/input|select|textarea/i.test(e.target.tagName)) return;
  if (view === 'cards') {
    if (e.key === ' ' || e.key === 'Enter') { const c = document.getElementById('card'); if (c && (e.target === c || e.target === document.body)) { e.preventDefault(); C.flipped = !C.flipped; c.classList.toggle('flipped', C.flipped); } }
    if (['1','2','3'].includes(e.key)) rateCard(+e.key - 1);
  }
  if (view === 'quiz' && Z.list) {
    if (['1','2','3','4'].includes(e.key)) answer(+e.key - 1);
    if (e.key === 'Enter' && Z.picked !== null) document.querySelector('[data-act="znext"]')?.click();
  }
});

updateTop();
const h = (location.hash || '').slice(1);
go(VIEWS[h] ? h : 'menu');
</script>

</html>
