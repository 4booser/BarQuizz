<!doctype html>
<html lang="uk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BarQuizz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Тренажер по меню бару: техкарти, картки, тести та збірка напоїв">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: app shell — sticky header, one working view at a time, bottom tab bar; a recipe opens as a sheet over the view */
:root{
  --bg:#0f1513; --surface:#161e1b; --surface-2:#1f2925; --line:#2b3732;
  --fg:#ece5d3; --muted:#97a39c; --accent:#d4a24c; --accent-ink:#1c1405;
  --good:#72c08d; --bad:#e3806f; --glass:#c9d3ce; --glass-fill:rgba(201,211,206,.06);
  --shadow:0 18px 40px rgba(0,0,0,.4);
  --f-display:"Prata","Georgia","Times New Roman",serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --c-spirit:#c98a3a; --c-liqueur:#b5578a; --c-bitter:#c4473d; --c-syrup:#e7a0b8;
  --c-cordial:#a68ad8; --c-citrus:#dccb4e; --c-juice:#e8894a; --c-soda:#8cc3d8;
  --c-dairy:#eadfc4; --c-foam:#f4f2ec; --c-tea:#9a7444; --c-premix:#d4a24c; --c-other:#7f8c86;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#edf1ec; --surface:#fbfcfa; --surface-2:#e2e9e3; --line:#c9d4cb;
    --fg:#15201b; --muted:#55645c; --accent:#94640f; --accent-ink:#fff8ea;
    --good:#2b8550; --bad:#b4473b; --glass:#4f5f58; --glass-fill:rgba(79,95,88,.06);
    --shadow:0 18px 40px rgba(20,40,30,.14);
    --c-citrus:#cdb92c; --c-foam:#fffefa; --c-dairy:#e6d6ae; --c-soda:#7db8cf;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#edf1ec; --surface:#fbfcfa; --surface-2:#e2e9e3; --line:#c9d4cb;
  --fg:#15201b; --muted:#55645c; --accent:#94640f; --accent-ink:#fff8ea;
  --good:#2b8550; --bad:#b4473b; --glass:#4f5f58; --glass-fill:rgba(79,95,88,.06);
  --shadow:0 18px 40px rgba(20,40,30,.14);
  --c-citrus:#cdb92c; --c-foam:#fffefa; --c-dairy:#e6d6ae; --c-soda:#7db8cf;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#161e1b; --surface-2:#1f2925; --line:#2b3732;
  --fg:#ece5d3; --muted:#97a39c; --accent:#d4a24c; --accent-ink:#1c1405;
  --good:#72c08d; --bad:#e3806f; --glass:#c9d3ce; --glass-fill:rgba(201,211,206,.06);
  --shadow:0 18px 40px rgba(0,0,0,.4);
  --c-citrus:#dccb4e; --c-foam:#f4f2ec; --c-dairy:#eadfc4; --c-soda:#8cc3d8;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.brand{font-family:var(--f-display);font-size:24px;letter-spacing:.01em;line-height:1;margin:0}
.brand span{color:var(--accent)}
.top-progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.top-progress b{color:var(--fg);font-family:var(--f-mono);font-weight:600}
.meter{width:96px;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.view{padding-block:20px 8px}
.view-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px}
.view-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,36px);line-height:1.1;margin:0;text-wrap:balance}
.view-head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:0 0 6px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s}
.chip small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:var(--accent-ink);opacity:.75}
.chip:hover{border-color:var(--accent)}

/* menu */
.toolbar{display:grid;gap:12px;margin-bottom:18px}
.search{position:relative}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 40px;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:13.5px;margin-bottom:16px}
.note b{color:var(--fg)}
.group{margin-bottom:26px}
.group h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
.group h3 small{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px;text-align:left;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;min-width:0;transition:transform .15s,border-color .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .mini{width:44px;height:58px}
.tile-name{font-weight:700;font-size:14.5px;line-height:1.25;overflow-wrap:anywhere}
.tile-meta{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.3}
.dots{display:flex;gap:3px;margin-top:6px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--surface-2)}
.dots i.on{background:var(--accent)}
.empty{color:var(--muted);padding:30px 0;text-align:center}

/* glass */
.glass{display:block;width:100%;height:auto;overflow:visible}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(5,9,7,.6);animation:fade .2s}
.sheet-panel{position:relative;width:min(780px,100%);max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:var(--shadow);padding:20px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:rise .25s cubic-bezier(.2,.8,.2,1)}
@media (min-width:820px){.sheet{align-items:center}.sheet-panel{border-radius:22px;border-bottom:1px solid var(--line);max-height:88vh;padding:28px 32px}}
@keyframes rise{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.d-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.d-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:22px;line-height:1}
.d-top{display:grid;grid-template-columns:170px minmax(0,1fr);gap:24px;align-items:start}
.d-glass{margin:0;text-align:center}
.d-glass svg{max-width:170px;margin:0 auto}
.d-glass figcaption{font-size:12.5px;color:var(--muted);margin-top:6px}
@media (max-width:600px){.d-top{grid-template-columns:1fr}.d-glass svg{max-width:140px}}
.ing-list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ing{display:grid;grid-template-columns:12px minmax(0,1fr) auto;column-gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ing:last-child{border-bottom:0}
.sw{width:12px;height:12px;border-radius:4px;background:var(--c);border:1px solid color-mix(in srgb,var(--fg) 18%,transparent)}
.ing-name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ing-name small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.04em}
.ing-amt{font-family:var(--f-mono);font-weight:600;font-size:14px;text-align:right;white-space:nowrap}
.ing-amt u{text-decoration:none;color:var(--muted);font-size:11px;margin-left:3px}
.ing-bar{grid-column:2 / 4;height:3px;background:var(--surface-2);border-radius:99px;margin-top:6px;overflow:hidden}
.ing-bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px}
.link{background:none;border:0;padding:0;color:inherit;font-weight:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;text-align:left}
.total{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding-top:10px}
.total b{font-family:var(--f-mono);color:var(--fg)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:22px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.fact p{margin:0;font-weight:600}
.fact .lbl{margin-bottom:6px}
.method{display:flex;gap:10px;align-items:flex-start}
.method + .method{margin-top:10px}
.method svg{flex:none;width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.method small{display:block;color:var(--muted);font-weight:500;font-size:12px;line-height:1.35}
.missing{color:var(--muted);font-weight:500;font-style:italic}
.block{margin-top:22px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.split{grid-template-columns:1fr}}
.split .fact ul{margin:6px 0 0;padding-left:18px}
.split .fact li{margin:2px 0}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:12px;font-weight:600;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--accent)}
.used{display:flex;flex-wrap:wrap;gap:6px}
.d-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent}

/* flashcards */
.deck-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
.counts{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.counts b{font-family:var(--f-mono);color:var(--fg);margin-right:4px}
.stage{perspective:1400px;max-width:560px;margin:0 auto}
.card{position:relative;height:min(64vh,520px);min-height:380px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.front{display:grid;place-items:center;text-align:center;padding:28px;background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--accent) 14%,var(--surface)) 0%,var(--surface) 60%)}
.front h3{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,8vw,48px);line-height:1.05;margin:8px 0 14px;text-wrap:balance}
.front p{color:var(--muted);margin:0;font-size:14px}
.front .hint{position:absolute;bottom:18px;left:0;right:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.back{transform:rotateY(180deg);overflow:auto;padding:20px 20px 24px}
.back h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 12px}
.back-grid{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:start}
.back .ing{padding:6px 0}
.mini-facts{display:grid;gap:6px;margin-top:14px;font-size:13.5px}
.mini-facts div{display:flex;gap:8px}
.mini-facts span{color:var(--muted);min-width:76px}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:16px auto 0}
.rate .btn{display:grid;gap:2px;padding:12px 8px;text-align:center}
.rate .btn small{font-weight:500;color:var(--muted);font-size:11.5px}
.rate .bad{border-color:color-mix(in srgb,var(--bad) 60%,var(--line))}
.rate .mid{border-color:var(--line)}
.rate .ok{border-color:color-mix(in srgb,var(--good) 60%,var(--line))}
.kbd{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center;margin-top:10px}

/* quiz */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.qz-setup{display:grid;gap:18px;max-width:640px}
.qz-progress{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.qz-progress .meter{flex:1;width:auto}
.qz-q{font-size:clamp(19px,4vw,24px);line-height:1.35;margin:0 0 14px;text-wrap:balance}
.qz-q b{font-family:var(--f-display);font-weight:400;color:var(--accent)}
.qz-sub{margin-bottom:14px}
.qz-sub .chip{cursor:default}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:13px 14px;font-weight:600;display:flex;gap:12px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);width:20px;height:20px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg))}
.opt:disabled{cursor:default}
.qz-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:16px}
.verdict{font-weight:700}
.verdict.good{color:var(--good)}
.verdict.bad{color:var(--bad)}
.score{font-family:var(--f-display);font-size:64px;line-height:1;margin:6px 0}
.mist{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:8px}
.mist li{border-top:1px solid var(--line);padding-top:8px;font-size:14px}
.mist li span{color:var(--good);font-weight:700}

/* builder */
.bd-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.bd-grid{grid-template-columns:1fr}}
.pool .chip{cursor:pointer}
.pool .chip[aria-pressed="true"]::before{content:"✓"}
.mine{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mine li{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 8px 8px 12px}
.mine li.ok{border-color:var(--good)}
.mine li.half{border-color:var(--accent)}
.mine li.no{border-color:var(--bad)}
.mine li .res{grid-column:1 / -1;font-size:12.5px;color:var(--muted)}
.mine li.ok .res{color:var(--good)}
.mine li.no .res{color:var(--bad)}
.mine input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--f-mono);text-align:right}
.field{display:grid;gap:6px;margin-top:12px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.bd-result{margin-top:14px;font-weight:700}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{background:none;border:0;border-radius:12px;padding:7px 4px;display:grid;justify-items:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted)}
.nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<header class="top">
  <div class="wrap">
    <h1 class="brand">Bar<span>Quizz</span></h1>
    <div class="top-progress" title="Позиції, які ти позначив як «Знаю» хоча б тричі">
      <span>Вивчено <b id="known">0</b> з <b id="total">0</b></span>
      <div class="meter"><i id="meter" style="width:0"></i></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="v-menu" class="view"></section>
  <section id="v-cards" class="view" hidden></section>
  <section id="v-quiz" class="view" hidden></section>
  <section id="v-build" class="view" hidden></section>
</main>

<nav class="nav" aria-label="Розділи">
  <div class="nav-in">
    <button data-nav="menu"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/><path d="M9 8h6"/></svg>Меню</button>

/* ---------- build model ---------- */
function parseIng(s){
  let inPremix = false;
  if (s.startsWith('•')) { inPremix = true; s = s.slice(1); }
  const m = s.match(/^(.+?)\s*-\s*(~?\d.*)$/);
  const name = m ? m[1].trim() : s.trim();
  const amt = m ? m[2].trim() : '';
  const num = /^\d+([.,]\d+)?$/.test(amt) ? parseFloat(amt.replace(',','.')) : null;
  const low = name.toLowerCase();
  let fam = 'other';
  for (const [k,re] of FAM) if (re.test(low)) { fam = k; break; }
  let link = null;
  for (const [re,id] of PREP_LINK) if (re.test(name)) { link = id; break; }
  return {name, amt, num, inPremix, fam, link};
}
const ITEMS = [], BY = {};
function add(it){ it.ing = it.ing.map(parseIng); ITEMS.push(it); BY[it.id] = it; }

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => s.toLowerCase().replace(/[^a-zа-яіїєґ0-9]/g,'');
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

const GLASS_NAMES = {highball:'Хайбол', rocks:'Олд Фешн', coupe:'Купе', nick:'Ніка Нора', wine:'Винний бокал', flute:'Флюте'};
function glassKey(it){
  if (it.cat === 'tea') return 'cup';
  if (it.cat === 'premix' || it.cat === 'prep') return 'bottle';
  const g = (it.glass || '').toLowerCase();
  if (!g) return 'rocks';
  if (/^олд|фешн/.test(g)) return 'rocks';
  if (/хайбол/.test(g)) return 'highball';
  if (/купе/.test(g)) return 'coupe';
  if (/нік|нора/.test(g)) return 'nick';
  if (/вин|вінк/.test(g)) return 'wine';
  if (/флют/.test(g)) return 'flute';
  return 'rocks';
}
let gid = 0;
function svgGlass(it, big){
  const k = glassKey(it), G = GL[k], id = 'cp' + (++gid);
  let layers = [];
  if (it.cat === 'tea') layers = [{fam:'tea', v:1}];
  else if (it.cat === 'prep') layers = [{fam: it.ing[0]?.fam || 'other', v:1}];
  else layers = it.ing.filter(g => isLiquid(it,g)).map(g => ({fam:g.fam, v:g.num}));
  const total = layers.reduce((s,l) => s + l.v, 0) || 1;
  let f = G.cap ? Math.min(.9, Math.max(.45, total / G.cap)) : (it.cat === 'tea' ? .78 : .82);
  if (!it.glass && ['cocktail','lemonade'].includes(it.cat)) f = .6;
  const H = (G.b - G.t) * f;
  let y = G.b, rects = '';
  layers.forEach((l,i) => {
    const h = H * l.v / total;
    y -= h;
    rects += `<rect x="0" y="${y.toFixed(2)}" width="120" height="${(h+.6).toFixed(2)}" fill="var(--c-${l.fam})"/>`;
    if (big && i < layers.length - 1) rects += `<rect x="0" y="${y.toFixed(2)}" width="120" height=".9" fill="var(--bg)" opacity=".55"/>`;
  });
  if (it.ing.some(g => g.fam === 'foam')) rects += `<rect x="0" y="${(y-7).toFixed(2)}" width="120" height="7.4" fill="var(--c-foam)"/>`;
  if (it.ing.some(g => g.fam === 'soda') && big) {
    for (let i=0;i<7;i++) rects += `<circle cx="${40 + (i*13)%42}" cy="${(G.b - H*((i*37)%100)/100).toFixed(1)}" r="${1.2 + (i%3)*.5}" fill="var(--bg)" opacity=".35"/>`;
  }
  const stroke = big ? 2.4 : 5;
  const unfilled = !it.glass && ['cocktail','lemonade'].includes(it.cat);
  return `<svg class="glass${big?'':' mini'}" viewBox="0 0 120 160" role="img" aria-label="${esc(it.glass || GLASS_NAMES[k] || '')}">
    <defs><clipPath id="${id}"><path d="${G.i}"/></clipPath></defs>
    <path d="${G.i}" fill="var(--glass-fill)"/>
    <g clip-path="url(#${id})">${rects}</g>
    <path d="${G.o}" fill="none" stroke="var(--glass)" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" ${unfilled?'stroke-dasharray="5 6"':''}/>
  </svg>`;
}

/* ---------- shared bits ---------- */
function dots(id){ const b = box(id); return `<div class="dots" aria-label="Рівень ${Math.max(0,b+1)} з 5">${[0,1,2,3,4].map(i=>`<i class="${i<=b?'on':''}"></i>`).join('')}</div>`; }
function meta(it){
  if (it.cat === 'premix') return `Бат · порція ${it.portion}`;
  if (it.cat === 'prep') return `Вихід ${it.yield}`;
  if (it.cat === 'tea') return `${it.ing.length} інгредієнтів`;
  if (it.price) return `Ціна ${it.price} · ${it.ing.length} інгр.`;
  return [it.glass, it.method].filter(Boolean).join(' · ') || 'Посуд і спосіб не вказані';
}
function ingRows(it, compact){
  const liq = it.ing.filter(g => isLiquid(it,g));
  const total = liq.reduce((s,g)=>s+g.num,0);
  return it.ing.map(g => {
    const L = isLiquid(it,g);
    const nm = g.link && BY[g.link] && g.link !== it.id ? `<button class="link" data-open="${g.link}">${esc(g.name)}</button>` : esc(g.name);
    const amt = L ? `${fmt(g.num)}<u>мл</u>` : esc(g.amt || '—');
    return `<li class="ing" style="--c:var(--c-${g.fam})"><span class="sw"></span>

const C = {cats:new Set(['cocktail','lemonade']), cur:null, flipped:false, last:null};
function nextCard(){
  const pool = ITEMS.filter(i => C.cats.has(i.cat));
  if (!pool.length) { C.cur = null; return; }
  const scored = pool.map(i => ({i, s: box(i.id)*10 + (S.seen[i.id] ? (S.seen[i.id] % 1e7)/1e7*3 : 0) + Math.random()*4}));
  scored.sort((a,b) => a.s - b.s);
  const choice = scored.find(x => x.i.id !== C.last) || scored[0];
  C.cur = choice.i.id; C.flipped = false;
}

function rateCard(r){
  const id = C.cur; if (!id) return;
  const b = box(id);
  if (r === 0) setBox(id, 0);
  else if (r === 1) setBox(id, Math.max(1, b));
  else setBox(id, b < 0 ? 2 : b + 1);
  save(); C.last = id; nextCard(); renderCards();
}

/* ---------- QUIZ ---------- */
const Z = {cats:new Set(['cocktail','lemonade']), n:10, list:null, i:0, score:0, picked:null, mistakes:[]};
const bq = s => `<b>${esc(s)}</b>`;
function mkQ(itemId, q, answer, pool, extra={}){
  const wrong = sample(uniq(pool).filter(x => x && x !== answer), 3);
  if (wrong.length < 3) return null;
  return {itemId, q, answer, options: shuffle([answer, ...wrong]), ...extra};
}
function numPool(v){
  const base = [5,10,15,20,25,30,35,40,45,50,60,70,75,80,100,120,150];
  return base.filter(x => x !== v).sort((a,b) => Math.abs(a-v) - Math.abs(b-v)).slice(0,5);
}
function buildQuiz(){
  const cats = [...Z.cats], Q = [];
  const drinks = ITEMS.filter(i => ['cocktail','lemonade'].includes(i.cat));
  const pools = {
    glass: uniq(drinks.map(i=>i.glass).filter(Boolean)),
    method: uniq(drinks.map(i=>i.method).filter(Boolean)),
    garnish: uniq(drinks.map(i=>i.garnish).filter(Boolean)),
  };
  for (const it of ITEMS) {
    if (!Z.cats.has(it.cat)) continue;
    const same = ITEMS.filter(o => o.cat === it.cat && o.id !== it.id);
    if (['cocktail','lemonade'].includes(it.cat)) {
      if (it.glass) Q.push(mkQ(it.id, `У чому подаємо ${bq(it.name)}?`, it.glass, pools.glass));
      if (it.method) Q.push(mkQ(it.id, `Спосіб приготування ${bq(it.name)}?`, it.method, pools.method));
      if (it.garnish) Q.push(mkQ(it.id, `Гарніш для ${bq(it.name)}?`, it.garnish, pools.garnish));
    }
    if (it.cat !== 'prep') {
      for (const g of it.ing) {
        if (g.num == null) continue;
        if (it.cat !== 'tea' && !isLiquid(it,g)) continue;
        const u = it.cat === 'tea' ? '' : ' мл';
        Q.push(mkQ(it.id, `Скільки ${bq(g.name)} у ${bq(it.name)}?`, fmt(g.num)+u, numPool(g.num).map(v => fmt(v)+u)));
      }
      if (it.ing.length >= 2 && it.cat !== 'premix') Q.push(mkQ(it.id, 'Що за напій?', it.name, same.map(o=>o.name), {sub: it.ing.map(g=>g.name)}));
      const own = it.ing.map(g => norm(g.name));
      const foreign = uniq(same.flatMap(o => o.ing.map(g => g.name))).filter(n => !own.includes(norm(n)));
      if (it.ing.length >= 3 && foreign.length) {
        const ans = pick(foreign);
        Q.push({itemId:it.id, q:`Що з цього НЕ входить у ${bq(it.name)}?`, answer:ans, options: shuffle([ans, ...sample(it.ing.map(g=>g.name),3)])});
      }
    }
    if (it.premix) {
      const inB = it.ing.filter(g=>g.inPremix).map(g=>g.name), svc = it.ing.filter(g=>!g.inPremix).map(g=>g.name);
      if (inB.length >= 3 && svc.length) { const a = pick(svc); Q.push({itemId:it.id, q:`Що в ${bq(it.name)} додаєш на сервісі, а не з бату?`, answer:a, options:shuffle([a, ...sample(inB,3)])}); }
      else if (svc.length >= 3 && inB.length) { const a = pick(inB); Q.push({itemId:it.id, q:`Що в ${bq(it.name)} вже є в баті?`, answer:a, options:shuffle([a, ...sample(svc,3)])}); }
    }
    if (it.cat === 'premix') Q.push(mkQ(it.id, `Порція преміксу ${bq(it.name)}?`, it.portion, ITEMS.filter(o=>o.cat==='premix').map(o=>o.portion)));
    if (it.cat === 'prep') {
      Q.push(mkQ(it.id, `Вихід заготовки ${bq(it.name)}?`, it.yield, same.map(o=>o.yield)));
      Q.push(mkQ(it.id, 'Що за заготовка?', it.name, same.map(o=>o.name), {sub: it.ing.map(g=>g.name)}));
      for (const g of it.ing) if (g.amt) {
        const others = uniq([...it.ing.map(x=>x.amt), ...sample(same.flatMap(o=>o.ing.map(x=>x.amt)),6)]);
        Q.push(mkQ(it.id, `Скільки ${bq(g.name)} в ${bq(it.name)}?`, g.amt, others));
      }
    }
  }
  for (const f of RAW.facts) if (Z.cats.has(f.cat)) Q.push({itemId:f.id, q:esc(f.q), answer:f.a, options:shuffle([f.a, ...f.w])});
  const seen = new Set();
  const out = shuffle(Q.filter(Boolean)).filter(q => { const k = q.q + (q.sub||''); if (seen.has(k)) return false; seen.add(k); return true; });
  // не більше 2 питань про одну позицію поспіль у сесії
  const per = {}, res = [];
  for (const q of out) { per[q.itemId] = (per[q.itemId]||0) + 1; if (per[q.itemId] <= 2) res.push(q); if (res.length >= Z.n) break; }
  return res;
}
function renderQuiz(){
  const el = document.getElementById('v-quiz');
  const head = `<div class="view-head"><div><h2>Тест по меню</h2><p>Посуд, способи, гарніші, граммовки, бат і заготовки. Помилки знижують рівень картки — вона частіше з’явиться в «Картках».</p></div></div>`;
  if (!Z.list) {
    el.innerHTML = head + `<div class="panel qz-setup">
      <div><p class="lbl">Що перевіряємо</p><div class="chips">${CAT_ORDER.map(c=>`<button class="chip" data-zcat="${c}" aria-pressed="${Z.cats.has(c)}">${CATS[c]}</button>`).join('')}</div></div>
      <div><p class="lbl">Кількість питань</p><div class="chips">${[10,20,40].map(n=>`<button class="chip" data-zn="${n}" aria-pressed="${Z.n===n}">${n}</button>`).join('')}</div></div>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><button class="btn primary" data-act="zstart" ${Z.cats.size?'':'disabled'}>Почати тест</button>
      ${S.best?`<span style="color:var(--muted);font-size:13px">Найкращий результат: <b style="color:var(--fg);font-family:var(--f-mono)">${S.best}%</b></span>`:''}</div></div>`;

  }
  if (Z.i >= Z.list.length) {

    el.innerHTML = head + `<div class="panel" style="max-width:640px"><p class="lbl">Результат</p><p class="score">${Z.score}<span style="color:var(--muted);font-size:28px"> / ${Z.list.length}</span></p>
      <p style="margin:0;color:var(--muted)">${pct>=90?'Чудово, меню в голові.':pct>=70?'Добре. Пройдися по помилках нижче.':'Варто повторити картки по цих позиціях.'}</p>
      ${Z.mistakes.length?`<p class="lbl" style="margin-top:18px">Помилки</p><ul class="mist">${Z.mistakes.map(m=>`<li>${m.q}<br><span>${esc(m.answer)}</span> · <button class="link" data-open="${m.itemId}">техкарта</button></li>`).join('')}</ul>`:''}
      <div class="d-actions"><button class="btn primary" data-act="zagain">Ще раз</button><button class="btn" data-act="zsetup">Змінити налаштування</button></div></div>`;
    return;
  }
  const q = Z.list[Z.i], done = Z.picked !== null;
  el.innerHTML = head + `<div class="panel" style="max-width:720px">
    <div class="qz-progress"><span>${Z.i+1} / ${Z.list.length}</span><div class="meter"><i style="width:${(Z.i/Z.list.length*100)}%"></i></div><span>✓ ${Z.score}</span></div>
    <p class="qz-q">${q.q}</p>
    ${q.sub?`<div class="chips qz-sub">${q.sub.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>`:''}
    <div class="opts">${q.options.map((o,k)=>{
      const cls = done ? (o===q.answer?'right':(o===Z.picked?'wrong':'')) : '';
      return `<button class="opt ${cls}" data-opt="${k}" ${done?'disabled':''}><span class="k">${k+1}</span>${esc(o)}</button>`;}).join('')}</div>
    <div class="qz-foot">${done?`<span class="verdict ${Z.picked===q.answer?'good':'bad'}">${Z.picked===q.answer?'Правильно':'Правильна відповідь: '+esc(q.answer)}</span>
      <span style="display:flex;gap:8px"><button class="btn ghost" data-open="${q.itemId}">Техкарта</button><button class="btn primary" data-act="znext">${Z.i+1<Z.list.length?'Далі':'Результат'}</button></span>`:'<span style="color:var(--muted);font-size:13px">Клавіші 1–4</span>'}</div></div>`;
}
function answer(k){
  const q = Z.list?.[Z.i]; if (!q || Z.picked !== null) return;
  Z.picked = q.options[k];
  if (Z.picked === q.answer) Z.score++;
  else { Z.mistakes.push(q); if (BY[q.itemId]) setBox(q.itemId, box(q.itemId) - 1); save(); }
  renderQuiz();
}
function startQuiz(){ Z.list = buildQuiz(); Z.i = 0; Z.score = 0; Z.picked = null; Z.mistakes = []; renderQuiz(); }

/* ---------- BUILD ---------- */
const B = {cats:new Set(['cocktail','lemonade']), item:null, pool:[], picked:{}, glass:'', method:'', checked:false};
function newBuild(id){
  const cand = ITEMS.filter(i => B.cats.has(i.cat) && ['cocktail','lemonade','premix'].includes(i.cat));
  const it = id ? BY[id] : (cand.length ? pick(cand.filter(i => i.id !== B.item?.id)) || cand[0] : null);
  B.item = it; B.picked = {}; B.glass = ''; B.method = ''; B.checked = false;
  if (!it) return;
  const own = new Set(it.ing.map(g => norm(g.name)));
  const others = uniq(ITEMS.filter(o => o.cat === it.cat && o.id !== it.id).flatMap(o => o.ing.map(g => g.name))).filter(n => !own.has(norm(n)));
  B.pool = shuffle([...it.ing.map(g=>g.name), ...sample(others, Math.max(5, 12 - it.ing.length))]);
}
function sameAmt(a, b){
  const n = s => parseFloat(String(s).replace(',','.').replace(/[^\d.]/g,''));
  const x = n(a), y = n(b);
  if (isNaN(x) || isNaN(y)) return String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
  return Math.abs(x - y) < 1e-9;
}
function renderBuild(){
  const el = document.getElementById('v-build');
  if (!B.item || !B.cats.has(B.item.cat)) newBuild();
  const it = B.item;
  const head = `<div class="view-head"><div><h2>Збери напій</h2><p>Обери інгредієнти з набору і впиши граммовки по пам’яті. Потім перевір.</p></div>
    <div class="chips">${['cocktail','lemonade','premix'].map(c=>`<button class="chip" data-bcat="${c}" aria-pressed="${B.cats.has(c)}">${CATS[c]}</button>`).join('')}</div></div>`;
  if (!it) { el.innerHTML = head + '<p class="empty">Обери хоча б одну категорію.</p>'; return; }
  const truth = Object.fromEntries(it.ing.map(g => [g.name, g]));
  const picked = Object.keys(B.picked);
  let rows = '', pts = 0, max = it.ing.length;
  for (const nm of picked) {
    const g = truth[nm]; let cls = '', res = '';
    if (B.checked) {
      if (!g) { cls = 'no'; res = 'Зайве — цього в напої немає'; pts -= .5; }
      else if (!g.amt || sameAmt(B.picked[nm], g.amt)) { cls = 'ok'; res = `Так: ${g.amt||'—'}${isLiquid(it,g)?' мл':''}`; pts += 1; }
      else { cls = 'half'; res = `Інгредієнт так, але кількість: ${g.amt}${isLiquid(it,g)?' мл':''}`; pts += .5; }
    }
    rows += `<li class="${cls}"><span style="font-weight:600;min-width:0;overflow-wrap:anywhere">${esc(nm)}</span>
      <input id="amt-${norm(nm)}" data-amt="${esc(nm)}" inputmode="decimal" placeholder="к-сть" value="${esc(B.picked[nm])}" ${B.checked?'disabled':''} aria-label="Кількість: ${esc(nm)}">
      ${B.checked?`<span class="res">${esc(res)}</span>`:''}</li>`;
  }
  if (B.checked) {
    for (const g of it.ing) if (!(g.name in B.picked)) rows += `<li class="no"><span style="font-weight:600">${esc(g.name)}</span><span style="font-family:var(--f-mono);text-align:right">${esc(g.amt)}</span><span class="res">Пропущено</span></li>`;
  }
  const hasGM = ['cocktail','lemonade'].includes(it.cat);
  const drinks = ITEMS.filter(i => ['cocktail','lemonade'].includes(i.cat));
  const gl = uniq(drinks.map(i=>i.glass).filter(Boolean)), me = uniq(drinks.map(i=>i.method).filter(Boolean));
  let extra = '';
  if (hasGM && it.glass) {
    const ok = B.glass === it.glass; if (B.checked && ok) pts += 1; max += 1;
    extra += `<div class="field"><label for="b-glass">Посуд</label><select id="b-glass" data-bsel="glass" ${B.checked?'disabled':''}><option value="">—</option>${gl.map(g=>`<option ${B.glass===g?'selected':''}>${esc(g)}</option>`).join('')}</select>${B.checked?`<span class="res" style="font-size:12.5px;color:var(--${ok?'good':'bad'})">${ok?'Так':'Правильно: '+esc(it.glass)}</span>`:''}</div>`;
  }
  if (hasGM && it.method) {
    const ok = B.method === it.method; if (B.checked && ok) pts += 1; max += 1;
    extra += `<div class="field"><label for="b-method">Спосіб</label><select id="b-method" data-bsel="method" ${B.checked?'disabled':''}><option value="">—</option>${me.map(g=>`<option ${B.method===g?'selected':''}>${esc(g)}</option>`).join('')}</select>${B.checked?`<span class="res" style="font-size:12.5px;color:var(--${ok?'good':'bad'})">${ok?'Так':'Правильно: '+esc(it.method)}</span>`:''}</div>`;
  }
  const pct = Math.max(0, Math.round(pts / max * 100));
  el.innerHTML = head + `<div class="panel" style="margin-bottom:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between">
      <div><p class="eyebrow">${CATS[it.cat]}</p><h3 style="font-family:var(--f-display);font-weight:400;font-size:30px;margin:0;line-height:1.1">${esc(it.name)}</h3></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><label class="sr" for="b-pick" hidden>Обрати напій</label>
      <select id="b-pick" data-bsel="pick" style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-width:200px">
        ${ITEMS.filter(i=>B.cats.has(i.cat)&&['cocktail','lemonade','premix'].includes(i.cat)).map(i=>`<option value="${i.id}" ${i.id===it.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select>
      <button class="btn" data-act="bnew">Випадковий</button></div></div>
    <div class="bd-grid">
      <div class="panel"><p class="lbl">Набір інгредієнтів</p><div class="chips pool">${B.pool.map(n=>`<button class="chip" data-pool="${esc(n)}" aria-pressed="${n in B.picked}" ${B.checked?'disabled':''}>${esc(n)}</button>`).join('')}</div></div>
      <div class="panel"><p class="lbl">Твій склад</p>${rows?`<ul class="mine">${rows}</ul>`:'<p class="missing" style="margin:0">Торкнись інгредієнтів зліва, щоб додати.</p>'}
        ${extra}
        ${B.checked?`<p class="bd-result">Результат: ${pct}%</p><div class="d-actions" style="margin-top:8px"><button class="btn primary" data-act="bnew">Наступний</button><button class="btn" data-open="${it.id}">Техкарта</button></div>`
          :`<div class="d-actions" style="margin-top:16px"><button class="btn primary" data-act="bcheck" ${picked.length?'':'disabled'}>Перевірити</button></div>`}
      </div></div>`;
  if (B.checked && !B.scored) {
    B.scored = true;
    if (pct >= 90) setBox(it.id, box(it.id) < 0 ? 2 : box(it.id) + 1); else if (pct < 50) setBox(it.id, 0);
    save();
  }
}

/* ---------- routing & events ---------- */
const VIEWS = {menu:renderMenu, cards:renderCards, quiz:renderQuiz, build:renderBuild};
let view = 'menu';
function go(v){
  if (!VIEWS[v]) v = 'menu';
  view = v;
  for (const k in VIEWS) document.getElementById('v-'+k).hidden = k !== v;
  document.querySelectorAll('[data-nav]').forEach(b => b.setAttribute('aria-current', b.dataset.nav === v ? 'page' : 'false'));
  VIEWS[v]();
  try { history.replaceState(null, '', '#' + v); } catch(e){}
  window.scrollTo(0,0);
}
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-act],#card'); if (!t) return;
  const d = t.dataset;
  if (d.nav) return go(d.nav);
  if (d.act === 'close') return closeDetail();
  if (d.open) { if (!sheet.hidden) lastFocus = lastFocus; return openDetail(d.open); }
  if (d.build) { closeDetail(); B.cats.add(BY[d.build].cat); newBuild(d.build); return go('build'); }
  if (d.card) { closeDetail(); C.cats.add(BY[d.card].cat); C.cur = d.card; C.flipped = false; return go('cards'); }
  if (d.mcat) { M.cat = d.mcat; return renderMenu(); }
  if (t.id === 'card') { C.flipped = !C.flipped; t.classList.toggle('flipped', C.flipped); return; }
  if (d.ccat) { C.cats.has(d.ccat) ? C.cats.delete(d.ccat) : C.cats.add(d.ccat); C.cur = null; return renderCards(); }
  if (d.rate) return rateCard(+d.rate);
  if (d.zcat) { Z.cats.has(d.zcat) ? Z.cats.delete(d.zcat) : Z.cats.add(d.zcat); return renderQuiz(); }
  if (d.zn) { Z.n = +d.zn; return renderQuiz(); }
  if (d.act === 'zstart' || d.act === 'zagain') return startQuiz();
  if (d.act === 'zsetup') { Z.list = null; return renderQuiz(); }
  if (d.opt) return answer(+d.opt);
  if (d.act === 'znext') {
    if (Z.i + 1 >= Z.list.length) { const pct = Math.round(Z.score / Z.list.length * 100); if (pct > (S.best||0)) { S.best = pct; save(); } }
    Z.i++; Z.picked = null; return renderQuiz();
  }
  if (d.bcat) { B.cats.has(d.bcat) ? B.cats.delete(d.bcat) : B.cats.add(d.bcat); B.item = null; B.scored = false; return renderBuild(); }
  if (d.pool !== undefined) { const n = d.pool; if (n in B.picked) delete B.picked[n]; else B.picked[n] = ''; return renderBuild(); }
  if (d.act === 'bcheck') { B.checked = true; B.scored = false; return renderBuild(); }
  if (d.act === 'bnew') { newBuild(); B.scored = false; return renderBuild(); }
});
document.addEventListener('input', e => { const n = e.target.dataset?.amt; if (n !== undefined) B.picked[n] = e.target.value; });
document.addEventListener('change', e => {
  const s = e.target.dataset?.bsel; if (!s) return;
  if (s === 'pick') { newBuild(e.target.value); B.scored = false; return renderBuild(); }
  B[s] = e.target.value;
});
document.addEventListener('keydown', e => {
  if (!sheet.hidden) { if (e.key === 'Escape') closeDetail(); return; }
  if (/input|select|textarea/i.test(e.target.tagName)) return;
  if (view === 'cards') {
    if (e.key === ' ' || e.key === 'Enter') { const c = document.getElementById('card'); if (c && (e.target === c || e.target === document.body)) { e.preventDefault(); C.flipped = !C.flipped; c.classList.toggle('flipped', C.flipped); } }
    if (['1','2','3'].includes(e.key)) rateCard(+e.key - 1);
  }
  if (view === 'quiz' && Z.list) {
    if (['1','2','3','4'].includes(e.key)) answer(+e.key - 1);
    if (e.key === 'Enter' && Z.picked !== null) document.querySelector('[data-act="znext"]')?.click();
  }
});

updateTop();
const h = (location.hash || '').slice(1);
go(VIEWS[h] ? h : 'menu');
</script>

</html>
